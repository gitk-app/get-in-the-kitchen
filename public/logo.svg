<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>GET IN THE KITCHEN</title>
  <desc>GITK steam monogram logo — gold initials on deep teal with steam wisps</desc>

  <!-- Background -->
  <rect width="320" height="160" rx="16" fill="#0A3D35"/>

  <!-- Steam wisps -->
  <path d="M118 42 Q116 33 119 24 Q122 15 120 6" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M138 37 Q135 25 139 14 Q143 3 140 -6" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M158 40 Q156 30 159 20 Q162 10 160 0" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M178 38 Q176 28 179 18 Q182 8 180 -2" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M198 41 Q196 31 199 21 Q202 11 200 1" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

  <!-- GITK lettermark -->
  <text x="160" y="100" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#C9A84C" letter-spacing="4">GITK</text>

  <!-- Decorative rule -->
  <rect x="72" y="109" width="176" height="1" rx="0.5" fill="#C9A84C" opacity="0.4"/>
  <circle cx="68" cy="109" r="2" fill="#C9A84C" opacity="0.5"/>
  <circle cx="252" cy="109" r="2" fill="#C9A84C" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="160" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7" font-weight="600" fill="white" letter-spacing="3">GET IN THE KITCHEN</text>

  <!-- Tagline -->
  <text x="160" y="144" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="5.5" fill="#4A8A7A" letter-spacing="2">REAL MEALS · REAL BUDGET · REAL LIFE</text>
</svg>
